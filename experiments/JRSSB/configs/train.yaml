# Historical real-fold null training parameters; learned-only estimator.
experiment_name: real_ddim_fid_matched
output_root: /cwork/yx306/RDR/JRSSB/real_ddim_fid_matched
training_protocol: original_hellinger_p_vs_midpoint_v1
batch_size: 512
num_workers: 0
num_epochs: 20
early_stop_patience: 5
early_stop_min_delta: 0.0
restore_mode: best_val
ratio_epsilon: 1.0e-06
real_fold_pixel_null:
  train_size_per_fold: 60000
  validation_size_per_fold: 19000
  test_size_per_fold: 9000
  model_repetitions: 5
  fold_seed_offset: 700000
  model_seed_offset: 800000
  preload_batch_size: 512
  preload_num_workers: 8
  preload_storage_dtype: uint8
  near_one_tolerances:
  - 0.05
  - 0.1
  - 0.2
  central_quantiles:
  - 0.01
  - 0.99
  central_bounds:
  - 0.8
  - 1.2
  maximum_absolute_mean_bias: 0.05
  minimum_fraction_within_0_10: 0.9
pixel_rdr:
  representation: pixels64_cnn
  source_center_crop: 178
  image_resolution: 64
  interpolation: bilinear_antialiased
  input_pixel_range:
  - -1
  - 1
  ndf: 64
  output_alpha: 1.0
  batch_size: 128
  evaluation_batch_size: 512
  num_workers: 4
  learning_rate: 0.0002
  adam_beta1: 0.9
  adam_beta2: 0.999
  weight_decay: 0.0
  onecycle_max_lr: 0.0006
  onecycle_pct_start: 0.1
  onecycle_div_factor: 10.0
  onecycle_final_div_factor: 1000.0
  scheduler: onecycle
  num_epochs: 50
  early_stop_min_epochs: 10
  gradient_clip_norm: 1.0
  bn_freeze_epoch: 5
  require_cuda_for_full: true
